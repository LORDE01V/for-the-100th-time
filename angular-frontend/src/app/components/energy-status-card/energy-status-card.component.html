<div class="energy-status-card">
  <div class="card-header">
    <i class="fas fa-exclamation-triangle"></i>
    <h3>Energy Status</h3>
  </div>
  <div class="status-content">
    <span class="caution-label">Caution!</span>
    <p class="usage">{{ usage }}% Usage</p>
    <p class="suggestion">Consider reducing usage to save more.</p>
  </div>
</div>
