<div class="energy-mode-card">
  <div class="card-header">
    <i class="fas fa-leaf"></i>
    <h3>Energy Mode</h3>
  </div>
  <div class="toggle-switch">
    <span>Saver Mode</span>
    <label class="switch">
      <input type="checkbox" [(ngModel)]="isSaverMode">
      <span class="slider round"></span>
    </label>
    <span>Boost Mode</span>
  </div>
  <p>Optimizes for low consumption</p>
</div>
