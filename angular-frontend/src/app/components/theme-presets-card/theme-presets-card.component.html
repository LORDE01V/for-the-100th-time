<div class="theme-presets-card">
  <div class="card-header">
    <i class="fas fa-palette"></i>
    <h3>Theme Presets</h3>
  </div>
  <div class="theme-swatches">
    <div *ngFor="let theme of themes" class="swatch" [style.background-color]="theme.color">
      <span>{{ theme.name }}</span>
    </div>
  </div>
  <p>Click a theme to preview and apply</p>
</div>
