<div class="top-up-container">
  <button mat-mini-fab color="primary" class="back-button" (click)="goBack()">
    <mat-icon>arrow_back</mat-icon>
  </button>

  <mat-card class="top-up-card">
    <h1 class="mat-headline-4">Top Up Your Balance</h1>
    <p class="current-balance mat-body-1">Current Balance: R{{ currentBalance | number:'1.2-2' }}</p>

    <form [formGroup]="topUpForm" (ngSubmit)="submitTopUp()">
      <mat-form-field appearance="outline">
        <mat-label>Amount (ZAR)</mat-label>
        <input matInput type="number" formControlName="amount" required>
        <mat-error *ngIf="topUpForm.get('amount')?.hasError('required')">Amount is required</mat-error>
        <mat-error *ngIf="topUpForm.get('amount')?.hasError('min')">Minimum R10</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Promo Code (Optional)</mat-label>
        <input matInput formControlName="promoCode">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Payment Method</mat-label>
        <mat-select formControlName="paymentMethod" required>
          <mat-option *ngFor="let method of paymentMethods" [value]="method">
            {{ method }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="topUpForm.get('paymentMethod')?.hasError('required')">Payment method is required</mat-error>
      </mat-form-field>

      <button 
        mat-raised-button 
        color="primary" 
        type="submit"
        [disabled]="topUpForm.invalid || isProcessing"
      >
        <span *ngIf="!isProcessing">Confirm Top-Up</span>
        <mat-spinner *ngIf="isProcessing" diameter="24" strokeWidth="3"></mat-spinner>
      </button>
    </form>
  </mat-card>
</div>
