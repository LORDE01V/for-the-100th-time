<div class="settings-container">
  <div class="settings-wrapper">
    <button mat-icon-button class="back-button" (click)="navigateBack()">
      <mat-icon>arrow_back</mat-icon>
      Back to Home
    </button>
    
    <h1 class="heading">Settings</h1>
    
    <form [formGroup]="settingsForm" (ngSubmit)="onSubmit()">
      <h2 class="subheading">Account Settings</h2>
      
      <mat-form-field appearance="outline">
        <mat-label>Old Password</mat-label>
        <input matInput formControlName="oldPassword" type="password" required>
        <mat-error *ngIf="settingsForm.get('oldPassword')?.errors?.['required']">
          Old password is required
        </mat-error>
      </mat-form-field>
      
      <mat-form-field appearance="outline">
        <mat-label>New Password</mat-label>
        <input matInput formControlName="newPassword" type="password" required>
        <mat-error *ngIf="settingsForm.get('newPassword')?.errors?.['required']">
          New password is required
        </mat-error>
        <mat-error *ngIf="settingsForm.get('newPassword')?.errors?.['minlength']">
          Minimum 8 characters required
        </mat-error>
      </mat-form-field>
      
      <mat-form-field appearance="outline">
        <mat-label>Confirm New Password</mat-label>
        <input matInput formControlName="confirmNewPassword" type="password" required>
        <mat-error *ngIf="settingsForm.get('confirmNewPassword')?.errors?.['required']">
          Please confirm your new password
        </mat-error>
        <mat-error *ngIf="settingsForm.get('confirmNewPassword')?.errors?.['mismatch']">
          Passwords do not match
        </mat-error>
      </mat-form-field>
      
      <h2 class="subheading">Preferences</h2>
      
      <mat-slide-toggle formControlName="receiveSms">Receive SMS Notifications</mat-slide-toggle>
      <mat-slide-toggle formControlName="receiveEmail">Receive Email Notifications</mat-slide-toggle>
      
      <button mat-raised-button color="primary" type="submit" class="submit-button" 
              [disabled]="settingsForm.invalid || loading">
        <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
        <span *ngIf="!loading">Save Changes</span>
      </button>
    </form>
    
    <!-- Confirmation Dialog Trigger -->
    <button mat-button color="warn" (click)="openConfirmationDialog()">Delete Account</button>
  </div>
</div>
