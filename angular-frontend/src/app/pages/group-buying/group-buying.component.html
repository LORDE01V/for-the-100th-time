<div class="min-h-screen bg-cover bg-center bg-fixed relative" 
     [style.background-image]="'url(assets/images/group_buying.png)'">
  <div class="absolute inset-0 bg-black bg-opacity-50"></div>
  
  <div class="container mx-auto p-6 relative z-10">
    <div class="bg-white bg-opacity-90 backdrop-blur-lg rounded-2xl shadow-xl p-8">
      <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800">Group Buying Campaigns</h1>
        <button 
          (click)="openNewCampaignDialog()"
          class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 transition-colors">
          Start New Campaign
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div *ngFor="let campaign of campaigns" 
             class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition-shadow">
          <img [src]="campaign.image" 
               [alt]="campaign.product" 
               class="w-full h-48 object-cover">
          
          <div class="p-4">
            <h3 class="text-xl font-semibold text-gray-800 mb-2">{{ campaign.product }}</h3>
            <div class="flex justify-between mb-2">
              <span class="text-gray-500 line-through">R{{ campaign.originalPrice | number }}</span>
              <span class="text-green-600 font-bold">R{{ campaign.groupPrice | number }}</span>
            </div>
            
            <div class="mb-4">
              <div class="flex justify-between text-sm text-gray-600 mb-1">
                <span>{{ campaign.participants }}/{{ campaign.goal }} joined</span>
                <span>{{ campaign.timeLeft }}</span>
              </div>
              <div class="w-full bg-gray-200 rounded-full h-2">
                <div class="bg-green-600 rounded-full h-2" 
                     [style.width.%]="getProgress(campaign)"></div>
              </div>
            </div>

            <button 
              class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition-colors">
              Join Campaign
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
