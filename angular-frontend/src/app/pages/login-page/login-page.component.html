<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <img src="assets/images/GridX-IMG.jpg" alt="GridX Logo" class="logo">
      <h2>Welcome Back</h2>
      <p>Sign in to manage your energy ecosystem</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email"
          placeholder="Enter your email"
          [ngClass]="{ 'error': loginForm.get('email')?.invalid && loginForm.get('email')?.touched }"
        >
        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error-message">
          <span *ngIf="loginForm.get('email')?.errors?.['required']">Email is required</span>
          <span *ngIf="loginForm.get('email')?.errors?.['email']">Invalid email format</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-input">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            id="password" 
            formControlName="password"
            placeholder="Enter your password"
            [ngClass]="{ 'error': loginForm.get('password')?.invalid && loginForm.get('password')?.touched }"
          >
          <span 
            class="toggle-password"
            (click)="togglePasswordVisibility()"
          >
            {{ showPassword ? 'visibility_off' : 'visibility' }}
          </span>
        </div>
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-message">
          Password is required
        </div>
      </div>

      <button 
        type="submit" 
        class="login-button"
        [disabled]="loginForm.invalid"
      >
        Sign In
      </button>

      <div *ngIf="errorMessage" class="error-message server-error">
        {{ errorMessage }}
      </div>
    </form>

    <div class="login-footer">
      <a href="/forgot-password" class="forgot-password">Forgot Password?</a>
      <p>Don't have an account? <a (click)="navigateToRegister()">Sign Up</a></p>
    </div>
  </div>
</div>
