<div class="page-container">
  <button mat-raised-button color="primary" (click)="navigateBack()" class="back-button">
    <mat-icon>arrow_back</mat-icon>
    Back to Home
  </button>

  <h1 class="page-title">Expenses</h1>

  <div class="summary-grid">
    <mat-card class="summary-card">
      <div class="card-header">
        <mat-icon class="card-icon">attach_money</mat-icon>
        <h3>Total Expenses</h3>
      </div>
      <p class="card-value total">R{{ totalExpenses.toFixed(2) }}</p>
    </mat-card>

    <mat-card class="summary-card">
      <div class="card-header">
        <mat-icon class="card-icon">trending_up</mat-icon>
        <h3>Monthly Average</h3>
      </div>
      <p class="card-value average">R{{ monthlyAverage.toFixed(2) }}</p>
    </mat-card>

    <mat-card class="summary-card">
      <div class="card-header">
        <mat-icon class="card-icon">event</mat-icon>
        <h3>Last Payment</h3>
      </div>
      <p class="card-value last-payment">{{ expenses[0]?.date }}</p>
    </mat-card>
  </div>

  <mat-card class="expenses-list">
    <h2 class="list-title">Recent Expenses</h2>
    <div class="expense-item" *ngFor="let expense of expenses">
      <div class="expense-info">
        <h3 class="category">{{ expense.category }}</h3>
        <p class="date">{{ expense.date }}</p>
      </div>
      <div class="expense-amount">
        <span class="amount">R{{ expense.amount.toFixed(2) }}</span>
        <mat-chip [color]="expense.status === 'Paid' ? 'primary' : 'warn'">
          {{ expense.status }}
        </mat-chip>
      </div>
    </div>
  </mat-card>
</div>
