<div class="user-profile-container">
  <h1>Personal Profile</h1>
  
  <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="profile-form">
    <div class="form-grid">
      <!-- First Name -->
      <div class="form-group">
        <label for="full_name">First Name</label>
        <input
          type="text"
          id="full_name"
          formControlName="full_name"
          [class.error]="f['full_name'].invalid && f['full_name'].touched"
        >
        <div *ngIf="f['full_name'].invalid && f['full_name'].touched" class="error-message">
          First name is required
        </div>
      </div>

      <!-- Last Name -->
      <div class="form-group">
        <label for="surname">Last Name</label>
        <input
          type="text"
          id="surname"
          formControlName="surname"
          [class.error]="f['surname'].invalid && f['surname'].touched"
        >
        <div *ngIf="f['surname'].invalid && f['surname'].touched" class="error-message">
          Last name is required
        </div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          [class.error]="f['email'].invalid && f['surname'].touched"
        >
        <div *ngIf="f['email'].errors" class="error-message">
          <span *ngIf="f['email'].errors['required']">Email is required</span>
          <span *ngIf="f['email'].errors['email']">Invalid email format</span>
        </div>
      </div>

      <!-- Phone Number -->
      <div class="form-group">
        <label for="phone_number">Phone Number</label>
        <input
          type="tel"
          id="phone_number"
          formControlName="phone_number"
          [class.error]="f['phone_number'].invalid && f['phone_number'].touched"
        >
        <div *ngIf="f['phone_number'].errors" class="error-message">
          <span *ngIf="f['phone_number'].errors['required']">Phone number is required</span>
          <span *ngIf="f['phone_number'].errors['pattern']">Invalid phone number (10 digits)</span>
        </div>
      </div>

      <!-- Address -->
      <div class="form-group full-width">
        <label for="address">Address</label>
        <input
          type="text"
          id="address"
          formControlName="address"
          [class.error]="f['address'].invalid && f['address'].touched"
        >
        <div *ngIf="f['address'].invalid && f['address'].touched" class="error-message">
          Address is required
        </div>
      </div>
    </div>

    <!-- Form Status Messages -->
    <div *ngIf="errorMessage" class="error-message server-error">
      {{ errorMessage }}
    </div>
    <div *ngIf="successMessage" class="success-message">
      {{ successMessage }}
    </div>

    <!-- Submit Button -->
    <button
      type="submit"
      class="submit-button"
      [disabled]="userForm.invalid || isSubmitting"
    >
      {{ isSubmitting ? 'Saving...' : 'Save Changes' }}
    </button>
  </form>
</div>
