<div class="forum-container">
  <div class="new-post">
    <h2>Start a Discussion</h2>
    <textarea 
      [formControl]="newPostContent"
      placeholder="Share your energy-saving tips or ask a question..."
    ></textarea>
    <button 
      (click)="submitPost()"
      [disabled]="!newPostContent.valid"
      class="post-button"
    >
      Post Discussion
    </button>
  </div>

  <div class="posts-list">
    <div *ngFor="let post of posts" class="post-card">
      <div class="post-header">
        <span class="author">{{ post.author }}</span>
        <span class="timestamp">{{ post.timestamp | date:'medium' }}</span>
      </div>
      <p class="content">{{ post.content }}</p>
      
      <div class="post-actions">
        <button (click)="likePost(post)" class="like-button">
          👍 {{ post.likes }}
        </button>
        <button (click)="toggleReply(post)" class="reply-button">
          💬 Reply
        </button>
      </div>

      <div *ngIf="post.replies.length" class="replies">
        <div *ngFor="let reply of post.replies" class="reply">
          <div class="reply-header">
            <span class="author">{{ reply.author }}</span>
            <span class="timestamp">{{ reply.timestamp | date:'short' }}</span>
          </div>
          <p class="content">{{ reply.content }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
