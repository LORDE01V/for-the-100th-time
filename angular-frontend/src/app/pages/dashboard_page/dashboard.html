<div class="dashboard-container">
  <!-- Header Section -->
  <header class="dashboard-header">
    <button class="back-button">
      <i class="fas fa-arrow-left"></i>
    </button>
    <div class="header-content">
      <h1>Energy Dashboard</h1>
      <p class="subtitle">Take control of your energy and discover ways to optimize your usage for a sustainable future!</p>
    </div>
  </header>

  <!-- Plan Selector Row -->
  <div class="plan-selector">
    <button class="suggest-plan-btn">Suggest Plan</button>
    <div class="location-inputs">
      <mat-form-field>
        <mat-label>Select city</mat-label>
        <mat-select>
          <mat-option *ngFor="let city of cities" [value]="city">{{ city }}</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field>
        <input matInput placeholder="Or search your home address">
      </mat-form-field>
      <button class="location-btn">
        <i class="fas fa-map-marker-alt"></i>
      </button>
    </div>
  </div>

  <!-- Main Dashboard Grid -->
  <div class="dashboard-grid">
    <!-- Column 1 -->
    <div class="grid-column">
      <app-energy-mode-card></app-energy-mode-card>
      <app-daily-forecast-card></app-daily-forecast-card>
      <app-solar-output-card></app-solar-output-card>
      <app-widget-layout-card></app-widget-layout-card>
    </div>

    <!-- Column 2 -->
    <div class="grid-column">
      <app-theme-presets-card></app-theme-presets-card>
      <app-energy-status-card></app-energy-status-card>
      <app-ai-tips-card></app-ai-tips-card>
      <app-solar-panel-fault-card></app-solar-panel-fault-card>
    </div>

    <!-- Column 3 -->
    <div class="grid-column">
      <app-recommended-plan-card></app-recommended-plan-card>
      <app-monthly-budget-card></app-monthly-budget-card>
      <app-activity-report-card></app-activity-report-card>
      <app-fault-visualization-card></app-fault-visualization-card>
    </div>
  </div>
</div>
